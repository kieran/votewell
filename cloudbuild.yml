# The GCP trigger for this file carries an `included-files` filter, so poll
# updates redeploy the frontend (Netlify) without rebuilding this api image.
#
# The globs mirror every input the build actually reads: the Dockerfile and its
# COPY lines, plus elections/*/ridings.geojson -- the only election file
# `make seed_mongo` consumes. The api serves /:lat,:lng from the database seeded
# at build time and reads no election files at runtime.
#
# Applied to trigger "push-to-master" (project votewell -- a 2nd-gen GitHub
# Apps-connected trigger, the only kind that supports included-files). Pass the
# globs as ONE comma-separated value: repeating --included-files replaces rather
# than appends, and it reports success while silently dropping the earlier ones.
#
#   gcloud builds triggers update github push-to-master \
#     --project=votewell --account=kieran@kieran.ca \
#     --included-files='Dockerfile,Makefile,package.json,package-lock.json,cloudbuild.yml,.dockerignore,.env.*,server/**,elections/*/ridings.geojson'

steps:

  # build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/votewell/api', '.']

  # push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/votewell/api']

  # Deploy container image to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['beta', 'run', 'deploy', 'api', '--image', 'gcr.io/votewell/api', '--region', 'us-east1','--platform', 'managed', '--quiet']

  # clean out old images
- name: 'gcr.io/cloud-builders/gcloud-slim'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e

      apt update && apt install -y jq

      images="api"
      for image in ${images[@]}; do
        echo "Cleaning image ${image}"
        c=0
        image="gcr.io/$PROJECT_ID/${image}"
        number_keep_images=3
        date=$(gcloud container images list-tags $image --limit=unlimited \
          --sort-by=~TIMESTAMP --format=json | TZ=/usr/share/zoneinfo/UTC jq -r '.['$number_keep_images'].timestamp.datetime | sub("(?<before>.*):"; .before ) | strptime("%Y-%m-%d %H:%M:%S%z") | mktime | strftime("%Y-%m-%d")')
        for digest in $(gcloud container images list-tags $image --limit=unlimited --sort-by=~TIMESTAMP \
          --filter="timestamp.datetime < '${date}'" --format='get(digest)'); do
          (
            set -x
            gcloud container images delete -q --force-delete-tags "${image}@${digest}"
          )
          c=c+1
        done
        echo "Deleted ${c} images for ${image}." >&2
      done


images:
- gcr.io/votewell/api
